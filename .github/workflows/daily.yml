# Daily reminder jobs for every hosted PlantOps copy (docs/DEPLOY.md).
# ON TIME: cron-job.org calls each address below at 07:01 India time (job list: docs/HANDBOOK.md section 10;
# STABILITY_PLAN B-01). GitHub's own schedule started this workflow 4-7 hours late, so the schedule here is only a
# safety net in case cron-job.org misses a day: every job sends each reminder once (dedupe), so a second call adds
# nothing.
#   Platform        POST <APP_URL>/api/cron/daily   (plan renewal reminders to owners; skipped while APP_URL is unset)
#   Lab Records     POST <LAB_URL>/api/cron/daily   (holds older than 24 h, Form 1 due)
#   Document Store  POST <DOCS_URL>/api/cron/daily  (expiry emails)
#   Floor Stock     POST <STOCK_URL>/api/cron/daily (low-stock emails still waiting; skipped while STOCK_URL is unset)
#   Complaint Box   POST <COMPLAINT_URL>/api/cron/daily (complaints still open; skipped while COMPLAINT_URL is unset)
#   Order Capture   POST <ORDER_URL>/api/cron/daily (notifications still waiting; skipped while ORDER_URL is unset)
#   Attendance      POST <ATTENDANCE_URL>/api/cron/daily (notifications still waiting, then "didn't mark OUT yesterday";
#                   skipped while ATTENDANCE_URL is unset)
#   Job applications POST <JOBS_URL>/api/cron/daily (notifications still waiting, 12-month removal of applications and
#                   their files incl. backup copies; skipped while JOBS_URL is unset)
# Each copy is a GitHub environment (Settings > Environments) with variables APP_URL, LAB_URL, DOCS_URL, STOCK_URL, COMPLAINT_URL, ORDER_URL, ATTENDANCE_URL, JOBS_URL and the
# secret CRON_SECRET. To add a copy: create its environment and add its name to `copy` below.
# A failed call fails the run, and GitHub emails the repo owner. "Run workflow" runs it by hand.
name: Daily jobs

on:
  schedule:
    - cron: "30 1 * * *" # safety net only: due 07:00 India time, GitHub starts it around 11:30-14:00
  workflow_dispatch:

permissions: {}

jobs:
  daily:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        copy: [shared]
    environment: ${{ matrix.copy }}
    steps:
      - name: Platform
        if: ${{ vars.APP_URL != '' }}
        env:
          URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/daily"
      - name: Lab Records
        if: ${{ !cancelled() }}
        env:
          URL: ${{ vars.LAB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/daily"
      - name: Document Store
        if: ${{ !cancelled() }}
        env:
          URL: ${{ vars.DOCS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/daily"
      - name: Floor Stock
        if: ${{ !cancelled() && vars.STOCK_URL != '' }}
        env:
          URL: ${{ vars.STOCK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/daily"
      - name: Complaint Box
        if: ${{ !cancelled() && vars.COMPLAINT_URL != '' }}
        env:
          URL: ${{ vars.COMPLAINT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/daily"
      - name: Order Capture
        if: ${{ !cancelled() && vars.ORDER_URL != '' }}
        env:
          URL: ${{ vars.ORDER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/daily"
      - name: Attendance
        if: ${{ !cancelled() && vars.ATTENDANCE_URL != '' }}
        env:
          URL: ${{ vars.ATTENDANCE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/daily"

      - name: Job applications
        if: ${{ !cancelled() && vars.JOBS_URL != '' }}
        env:
          URL: ${{ vars.JOBS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/daily"
