# Evening and morning jobs for every hosted PlantOps copy (docs/notifications.md). MANUAL RUNS ONLY.
# ON TIME: cron-job.org calls these addresses (job list: docs/HANDBOOK.md section 10; STABILITY_PLAN B-01):
#   Lab Records  POST <LAB_URL>/api/cron/evening    hourly 17:01-23:01 India time ("No lab tests entered today", from
#                8 pm; earlier calls do nothing)
#   Floor Stock  POST <STOCK_URL>/api/cron/evening  hourly 17:01-23:01 ("Today's stock count is not done yet" at each
#                plant's hour)
#   Attendance   POST <ATTENDANCE_URL>/api/cron/morning hourly 08:01-11:01 ("N people not marked by 10:00" at each
#                plant's hour, to owners and supervisors; docs/ATTENDANCE_ROLES_PHASE_PLAN.md)
# GitHub's schedule ran these only about twice a day, often after midnight (when they do nothing), and never in the
# morning, so the schedule lines were removed. Every job sends each reminder once a day (dedupe), so a manual run
# never sends twice; every call also resends notifications waiting in the modules' outboxes.
# Same GitHub environments, variables and CRON_SECRET as daily.yml. "Run workflow" runs every step.
name: Evening jobs

on:
  workflow_dispatch:

permissions: {}

jobs:
  evening:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        copy: [shared]
    environment: ${{ matrix.copy }}
    steps:
      - name: Lab Records
        if: ${{ vars.LAB_URL != '' }}
        env:
          URL: ${{ vars.LAB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/evening"
      - name: Floor Stock
        if: ${{ !cancelled() && vars.STOCK_URL != '' }}
        env:
          URL: ${{ vars.STOCK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/evening"
      - name: Attendance (not marked)
        if: ${{ !cancelled() && vars.ATTENDANCE_URL != '' }}
        env:
          URL: ${{ vars.ATTENDANCE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$URL/api/cron/morning"
